services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ansh, POSTGRES_PASSWORD: ansh_dev_password, POSTGRES_DB: anshever }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ansh -d anshever"], interval: 5s, retries: 10 }
  web:
    build: .
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://ansh:ansh_dev_password@db:5432/anshever
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
volumes: { pgdata: {} }
